[project]
name = "total-recall"
version = "0.1.0"
description = "A Zero-Cost, Privacy-First Conversational Intelligence Engine for WhatsApp (macOS)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
vec = ["sqlite-vec>=0.1.6"]

[project.scripts]
total-recall = "total_recall.cli:main"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["total_recall"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
